[project]
name = "flatarmac"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fabio Meier", email = "fabitosh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.2.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
]

[project.scripts]
flatarmac = "flatarmac:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
